spring.application.name=lis-reservas-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lis_reservas}
spring.datasource.username=${DB_USERNAME:lis}
spring.datasource.password=${DB_PASSWORD:lis}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.write-dates-as-timestamps=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# CORS para el frontend React local
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000
