spring.application.name=equipment-api

# ---------------------------------------------------------------------------
# Base de datos (PostgreSQL en la nube). Se configura por variables de entorno
# para no versionar credenciales. Ver .env.example.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Paginacion por defecto de GET /api/equipment
# ---------------------------------------------------------------------------
spring.data.web.pageable.default-page-size=12
spring.data.web.pageable.max-page-size=100

# ---------------------------------------------------------------------------
# Autenticacion (BONUS): SSO de Google restringido a correos @udea.edu.co
# ---------------------------------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Clave para firmar los JWT (HS384: minimo 48 caracteres)
jwt.secret=${JWT_SECRET}

# A donde se redirige al usuario tras un login correcto, con ?token=<jwt>
app.frontend.redirect-uri=${FRONTEND_REDIRECT_URI:http://localhost:5173/auth/callback}

# ---------------------------------------------------------------------------
# CORS: origenes desde los que el frontend puede llamar a la API
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# ---------------------------------------------------------------------------
# Proteccion de las escrituras, separada por tipo de accion.
#
# GESTION DEL INVENTARIO (POST y PUT de /api/equipment)
#   true (por defecto) -> exige sesion iniciada con ROLE_USER.
#   Administrar el catalogo es una accion de gestion, no de uso: quien pasa
#   por el laboratorio reserva un equipo, pero no da de alta ni edita el
#   inventario.
#
# RESERVAS (POST y DELETE de /api/reservations)
#   false (por defecto) -> publicas. Lo exige el requisito OBLIGATORIO:
#   "un usuario identificado por nombre y correo" debe poder crear, cancelar
#   y listar reservas sin depender del bonus de autenticacion.
#   A true se activa el modo BONUS y reservar exige un JWT.
#
# En ambos casos, si la peticion trae un JWT valido la identidad se toma del
# token y no del cuerpo, de modo que nadie pueda suplantar a otro usuario.
# ---------------------------------------------------------------------------
app.security.protect-equipment=${PROTECT_EQUIPMENT:true}
app.security.protect-reservations=${PROTECT_RESERVATIONS:false}

# Duracion maxima de una reserva, en horas. Impide que una sola peticion
# bloquee un equipo durante semanas.
app.reservations.max-hours=${RESERVATION_MAX_HOURS:8}

# Completa el catalogo de equipos al arrancar. Es idempotente: inserta solo
# los numeros de serie que aun no existen, sin duplicar los ya presentes.
app.seed.enabled=${SEED_ENABLED:true}

logging.level.org.springframework.security=INFO