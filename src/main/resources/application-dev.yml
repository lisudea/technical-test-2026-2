# Local development profile — MySQL 8 via podman-compose (infra/compose.yaml)
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/reservas_lis?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true
    username: reservas
    password: reservas
    hikari:
      maximum-pool-size: 10
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.lis.reservas: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

auth:
  google:
    enabled: false
