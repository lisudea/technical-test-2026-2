# Production profile — AWS RDS MySQL 8. ALL secrets come from environment
# variables (never committed); in ECS they are injected from AWS Secrets Manager.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  jpa:
    show-sql: false

auth:
  jwt:
    secret: ${JWT_SECRET}
  google:
    enabled: ${GOOGLE_SSO_ENABLED:true}
    client-id: ${GOOGLE_CLIENT_ID}

logging:
  level:
    com.lis.reservas: INFO
    root: WARN
