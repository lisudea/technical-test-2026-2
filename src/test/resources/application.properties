# ---------------------------------------------------------------------------
# Configuracion EXCLUSIVA de los tests.
#
# Antes, `mvnw test` fallaba si no estaban definidas las 6 variables de entorno
# de produccion, porque @SpringBootTest intentaba conectarse a la PostgreSQL
# real. Aqui se usa H2 en memoria y valores ficticios, de modo que los tests
# corren en cualquier maquina recien clonada.
# ---------------------------------------------------------------------------

spring.datasource.url=jdbc:h2:mem:equipmentdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Clave ficticia de 64 caracteres (HS384 exige al menos 48)
jwt.secret=test-secret-para-pruebas-locales-no-usar-en-produccion-0123456789

# Credenciales de Google ficticias: el SSO no se ejercita en los tests
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# Sin datos semilla: cada test prepara los suyos
app.seed.enabled=false

logging.level.org.springframework.security=WARN