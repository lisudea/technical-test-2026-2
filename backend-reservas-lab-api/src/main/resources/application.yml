server:
  max-http-request-header-size: 65536
  tomcat:
    keep-alive-timeout: 20000
    max-keep-alive-requests: 100
  port: 8080

spring:
  mvc:
    servlet:
      load-on-startup: 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: api-reservas-laboratorio

  datasource:
    url: jdbc:h2:file:./data/labreservas;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

    hikari:
      maximum-pool-size: 20
      connection-timeout: 20000
      idle-timeout: 10000

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID}"
            scope:
              - openid
              - email
              - profile

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  scheduler:
    reservation-finalize-cron: ${RESERVATION_FINALIZE_CRON:0 0 0 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org:
      springframework:
        web:
          filter: TRACE
          servlet:
            HandlerExecutionChain: TRACE
      apache:
        catalina:
          core: DEBUG
        tomcat:
          util:
            threads: TRACE

      hibernate:
        type:
          descriptor:
            sql:
              BasicBinder: TRACE