version: "3.9"

services:
  db:
    image: postgres:14.13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lis
      POSTGRES_PASSWORD: lis_password
      POSTGRES_DB: lis_equipos
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lis -d lis_equipos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lis:lis_password@db:5432/lis_equipos
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
