<!-- public/login.html -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LIS · Terminal de acceso</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1410;
    --panel: #131b16;
    --panel-border: #223027;
    --grid-line: #17201a;
    --text: #e7efe9;
    --muted: #7c8f82;
    --accent: #3ecf7e;
    --accent-dim: #1f5c3d;
    --error: #f2837a;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 34px 34px;
    font-family: var(--sans);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 36px 32px 32px;
    position: relative;
    animation: rise 0.5s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card::before {
    content: "";
    position: absolute;
    top: -1px; left: -1px; right: -1px;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), transparent 70%);
    border-radius: 4px 4px 0 0;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }

  .eyebrow .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(62, 207, 126, 0.15);
  }

  h1 {
    font-family: var(--mono);
    font-size: 21px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  p.sub {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 28px;
    line-height: 1.5;
  }

  p.sub code {
    font-family: var(--mono);
    color: var(--accent);
    background: rgba(62, 207, 126, 0.08);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 13px;
  }

  .btn-wrap {
    display: flex;
    justify-content: center;
    padding: 4px 0 8px;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--panel-border);
    margin: 28px 0 20px;
  }

  #resultado {
    font-size: 13px;
  }

  .estado-linea {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .resultado-ok .titulo {
    color: var(--accent);
    font-weight: 600;
    font-family: var(--mono);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 4px;
  }

  .resultado-ok .titulo::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }

  .resultado-error .titulo {
    color: var(--error);
    font-weight: 600;
    font-family: var(--mono);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 4px;
  }

  .resultado-error .titulo::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--error);
  }

  .usuario-linea {
    color: var(--muted);
    margin: 6px 0 16px;
  }

  label.token-label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  textarea {
    width: 100%;
    background: #0a100c;
    border: 1px solid var(--panel-border);
    border-radius: 3px;
    color: var(--accent);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    padding: 10px;
    resize: vertical;
    outline: none;
  }

  textarea:focus {
    border-color: var(--accent-dim);
  }

  .copy-btn {
    margin-top: 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 3px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .copy-btn:hover {
    border-color: var(--accent-dim);
    color: var(--accent);
  }

  .copy-btn:focus-visible,
  .btn-wrap :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="eyebrow"><span class="dot"></span> LIS · Sistema de Reservas</div>
    <h1>Terminal de acceso</h1>
    <p class="sub">Inicia sesión con tu cuenta institucional. Solo se conceden tokens a correos <code>@udea.edu.co</code>.</p>

    <div class="btn-wrap">
      <div id="g_id_onload"
           data-client_id="99934157372-mf7edoesm3o7jiuevld2kiofef08e8p7.apps.googleusercontent.com"
           data-callback="manejarRespuestaGoogle">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-theme="filled_black"
           data-shape="rectangular"
           data-size="large">
      </div>
    </div>

    <hr class="divider" />

    <div id="resultado">
      <p class="estado-linea">// esperando autenticación...</p>
    </div>
  </div>

  <script>
    async function manejarRespuestaGoogle(respuesta) {
      const resultadoDiv = document.getElementById("resultado");
      resultadoDiv.innerHTML = `<p class="estado-linea">// verificando con Google...</p>`;

      try {
        const res = await fetch("http://localhost:3000/auth/google", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ credential: respuesta.credential }),
        });

        const datos = await res.json();

        if (res.ok) {
          resultadoDiv.innerHTML = `
            <div class="resultado-ok">
              <div class="titulo">Acceso concedido</div>
              <div class="usuario-linea">${datos.usuario.nombre} · ${datos.usuario.correo}</div>
              <label class="token-label">JWT (úsalo en Postman)</label>
              <textarea id="tokenBox" rows="5" readonly>${datos.token}</textarea>
              <button class="copy-btn" onclick="copiarToken()">Copiar token</button>
            </div>
          `;
        } else {
          resultadoDiv.innerHTML = `
            <div class="resultado-error">
              <div class="titulo">Acceso denegado</div>
              <div class="usuario-linea">${datos.mensaje}</div>
            </div>
          `;
        }
      } catch (error) {
        resultadoDiv.innerHTML = `
          <div class="resultado-error">
            <div class="titulo">Error de conexión</div>
            <div class="usuario-linea">No se pudo contactar al servidor.</div>
          </div>
        `;
      }
    }

    function copiarToken() {
      const box = document.getElementById("tokenBox");
      box.select();
      navigator.clipboard.writeText(box.value);
    }
  </script>

</body>
</html>
