services:
  postgres:
    image: postgres:16-alpine
    container_name: lis-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-lis_db}
      POSTGRES_USER: ${DB_USERNAME:-lis_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lis_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lis_user} -d ${DB_NAME:-lis_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: lis-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-lis_db}
      DB_USERNAME: ${DB_USERNAME:-lis_user}
      DB_PASSWORD: ${DB_PASSWORD:-lis_pass}
      SERVER_PORT: 8080
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: lis-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
