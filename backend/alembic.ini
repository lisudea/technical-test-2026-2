# Configuración de Alembic, la herramienta de migraciones.
#
# Una MIGRACIÓN es un archivo que describe un cambio en la estructura de la
# base de datos (crear una tabla, añadir una columna). Tenerlas versionadas
# permite reconstruir la base de datos desde cero ejecutando los cambios en
# orden, y saber exactamente qué cambió y cuándo.

[alembic]
# Carpeta donde viven las migraciones.
script_location = alembic

# Permite que las migraciones importen el código del proyecto
# (por ejemplo "from app.models import Equipo").
prepend_sys_path = .

# La dirección de la base de datos se deja VACÍA aquí a propósito:
# alembic/env.py la lee de la variable de entorno DATABASE_URL, para no
# duplicar la configuración ni escribir contraseñas en un archivo que se sube
# al repositorio.
sqlalchemy.url =


# --- Configuración de los mensajes que Alembic escribe en consola ---

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
