spring:
  application:
    name: equipment-reservation-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/equipment_reservation}
    username: ${DATABASE_USERNAME:your_username}
    password: ${DATABASE_PASSWORD:your_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Bogota
    open-in-view: false
  sql:
    init:
      mode: never