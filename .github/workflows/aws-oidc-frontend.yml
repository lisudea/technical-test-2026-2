name: 1021805193 · AWS OIDC · Frontend

run-name: "AWS OIDC validation · Reto 3 · 1021805193"

on:
  push:
    branches:
      - 1021805193-reto3
    paths:
      - ".github/workflows/aws-oidc-frontend.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  aws-identity:
    name: ☁️ AWS OIDC · Frontend Identity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: lisource-reto3-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify AWS caller identity
        shell: bash
        run: |
          echo "Validating temporary AWS identity for LISource Frontend..."
          aws sts get-caller-identity

      - name: Verify assumed frontend role
        shell: bash
        run: |
          identity_arn="$(aws sts get-caller-identity --query Arn --output text)"

          echo "Authenticated ARN: ${identity_arn}"

          if [[ "${identity_arn}" != *"assumed-role/lisource-github-oidc-reto3/"* ]]; then
            echo "Unexpected AWS role."
            exit 1
          fi

          echo "GitHub OIDC successfully assumed the LISource Frontend AWS role."