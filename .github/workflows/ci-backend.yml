name: CI Backend

# Runs on every push to the delivery branch and on PRs targeting it.
# Jobs: compile check -> unit tests -> container image build.
on:
  push:
    branches: [ "1007239188-reto2" ]
    paths:
      - "src/**"
      - "pom.xml"
      - "infra/containers/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [ "1007239188-reto2" ]

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------
  # Lint / compile — fail fast on compilation errors before the
  # heavier test job spins up Testcontainers.
  # -----------------------------------------------------------------
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile main sources
        run: ./mvnw -B -q compile

  # -----------------------------------------------------------------
  # Unit tests — JUnit 5 + Mockito. Testcontainers integration tests
  # are skipped here unless a container engine is available; see the
  # `verify` step for the full Testcontainers run.
  # -----------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  # -----------------------------------------------------------------
  # Build the OCI image. Uses Docker (preinstalled on the runner) so
  # the job works without a Podman install; the Containerfile is
  # engine-agnostic and works with either.
  # -----------------------------------------------------------------
  build-image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -f infra/containers/backend.containerfile \
            -t reservas-backend:ci \
            .

      - name: Inspect image
        run: docker image inspect reservas-backend:ci --format '{{.Size}} bytes'
