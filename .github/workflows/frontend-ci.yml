name: 1021805193 · Frontend CI/CD

run-name: "${{ github.event.head_commit.message || github.event.pull_request.title }} · Reto 3 · 1021805193"

on:
  push:
    branches:
      - 1021805193-reto3
  pull_request:
    branches:
      - 1021805193-reto3

permissions:
  contents: read

jobs:
  quality:
    name: 🧪 Test, Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lisource-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lisource-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build

  docker:
    name: 🐳 Validate Docker Image
    needs: quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lisource-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t lisource-frontend:ci .

  deploy:
    name: ▲ Deploy to Vercel
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/1021805193-reto3'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lisource-frontend

    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@58.9.0

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifacts
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  smoke:
    name: 🌐 Production Smoke Test
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/1021805193-reto3'
    runs-on: ubuntu-latest

    steps:
      - name: Verify frontend production
        run: |
          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 120 \
            --output /dev/null \
            "https://lisource-1021805193.vercel.app/"

      - name: Verify frontend login route
        run: |
          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 120 \
            --output /dev/null \
            "https://lisource-1021805193.vercel.app/ingreso"

      - name: Verify backend health
        run: |
          response=$(curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --max-time 120 \
            "https://technical-test-2026-2-v96h.onrender.com/actuator/health")

          echo "$response"
          echo "$response" | grep -q '"status":"UP"'

      - name: Verify backend OpenAPI
        run: |
          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --max-time 120 \
            --output /dev/null \
            "https://technical-test-2026-2-v96h.onrender.com/v3/api-docs"