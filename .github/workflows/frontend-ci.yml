name: LISource · Reto 3 · Frontend DevSecOps

run-name: "${{ github.event.head_commit.message || github.event.pull_request.title || 'Manual validation' }} · Frontend · 1021805193"

on:
  push:
    branches:
      - 1021805193-reto3
    paths:
      - "lisource-frontend/**"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    branches:
      - 1021805193-reto3
    paths:
      - "lisource-frontend/**"
      - ".github/workflows/frontend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: 🧪 Quality Gate · Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lisource-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lisource-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build

  codeql:
    name: 🔐 CodeQL · JavaScript/TypeScript
    needs: quality
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze JavaScript and TypeScript security
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  docker:
    name: 🐳 Container · Build & Validate
    needs: codeql
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lisource-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t lisource-frontend:ci .

      - name: Export Docker image
        run: |
          docker save lisource-frontend:ci \
            | gzip -1 \
            > "$RUNNER_TEMP/lisource-frontend-ci.tar.gz"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: lisource-frontend-image
          path: ${{ runner.temp }}/lisource-frontend-ci.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  trivy:
    name: 🛡️ Trivy · Container Security
    needs: docker
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: lisource-frontend-image
          path: ${{ runner.temp }}

      - name: Load Docker image
        run: |
          gzip -dc "$RUNNER_TEMP/lisource-frontend-ci.tar.gz" \
            | docker load

      - name: Generate Trivy security report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lisource-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Enforce critical vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lisource-frontend:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    name: ▲ Vercel · Deploy
    needs: trivy
    if: github.event_name == 'push' && github.ref == 'refs/heads/1021805193-reto3'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lisource-frontend

    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@58.9.0

      - name: Deploy to Vercel production
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

  smoke:
    name: 🌐 Production · Smoke Test
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/1021805193-reto3'
    runs-on: ubuntu-latest

    steps:
      - name: Verify frontend production
        run: |
          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 120 \
            --output /dev/null \
            "https://lisource-1021805193.vercel.app/"

      - name: Verify frontend login route
        run: |
          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 120 \
            --output /dev/null \
            "https://lisource-1021805193.vercel.app/ingreso"

      - name: Verify backend health
        run: |
          response=$(curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --max-time 120 \
            "https://technical-test-2026-2-v96h.onrender.com/actuator/health")

          echo "$response"
          echo "$response" | grep -q '"status":"UP"'

      - name: Verify backend OpenAPI
        run: |
          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --max-time 120 \
            --output /dev/null \
            "https://technical-test-2026-2-v96h.onrender.com/v3/api-docs"

  aws-identity:
    name: ☁️ AWS · OIDC Identity
    needs: trivy
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/1021805193-reto3'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: lisource-reto3-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify AWS caller identity
        shell: bash
        run: |
          identity_arn="$(aws sts get-caller-identity --query Arn --output text)"

          echo "Temporary AWS identity acquired through GitHub OIDC."

          if [[ "${identity_arn}" != *"assumed-role/lisource-github-oidc-reto3/"* ]]; then
            echo "Unexpected AWS role."
            exit 1
          fi

          echo "LISource Frontend successfully assumed the expected AWS IAM role."
