name: 1021805193 · Frontend CI

run-name: "${{ github.event.head_commit.message || github.event.pull_request.title }} · Reto 3 · 1021805193"

on:
  push:
    branches:
      - 1021805193-reto3
  pull_request:
    branches:
      - 1021805193-reto3

permissions:
  contents: read

jobs:
  quality:
    name: 🧪 Test, Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lisource-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lisource-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build

  docker:
    name: 🐳 Validate Docker Image
    needs: quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lisource-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t lisource-frontend:ci .