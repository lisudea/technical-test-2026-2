name: 1021805193 · Backend CI

run-name: "Reto 2 · Backend · ${{ github.ref_name }} · @${{ github.actor }}"

on:
  push:
    branches:
      - 1021805193-reto2
  pull_request:
    branches:
      - 1021805193-reto2

permissions:
  contents: read

jobs:
  quality:
    name: 🧪 Test & Verify Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lisource-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: lisource-backend/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests and verification
        run: ./mvnw -B clean verify

  docker:
    name: 🐳 Validate Docker Image
    needs: quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lisource-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t lisource-backend:ci .