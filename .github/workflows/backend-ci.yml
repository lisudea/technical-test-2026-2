name: 1021805193 · Backend CI/CD

run-name: "${{ github.event.head_commit.message || github.event.pull_request.title }} · Reto 2 · 1021805193"

on:
  push:
    branches:
      - 1021805193-reto2
  pull_request:
    branches:
      - 1021805193-reto2

permissions:
  contents: read

jobs:
  quality:
    name: 🧪 Test & Verify Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lisource-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: lisource-backend/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests and verification
        run: ./mvnw -B clean verify

  codeql:
    name: 🔐 CodeQL · Java
    needs: quality
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none

      - name: Analyze Java security
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"

  terraform:
    name: 🏗️ Terraform IaC Validation
    needs: quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/aws-oidc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

  docker:
    name: 🐳 Docker & 🛡️ Trivy
    needs:
      - codeql
      - terraform
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    defaults:
      run:
        working-directory: lisource-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t lisource-backend:ci .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lisource-backend:ci
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Enforce critical vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lisource-backend:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    name: 🚀 Deploy to Render
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/1021805193-reto2'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"

  smoke:
    name: 🌐 Production Smoke Test
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/1021805193-reto2'
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Render and verify production
        run: |
          for attempt in $(seq 1 24); do
            echo "Production verification attempt ${attempt}/24"

            health="$(
              curl --silent --show-error \
                --max-time 30 \
                "https://technical-test-2026-2-v96h.onrender.com/actuator/health" \
                || true
            )"

            openapi="$(
              curl --silent --show-error \
                --max-time 30 \
                "https://technical-test-2026-2-v96h.onrender.com/v3/api-docs" \
                || true
            )"

            if echo "$health" | grep -q '"status":"UP"' \
              && echo "$openapi" | grep -q 'https://technical-test-2026-2-v96h.onrender.com' \
              && echo "$openapi" | grep -q '/api/v1/equipment'; then

              echo "LISource backend production is healthy."
              exit 0
            fi

            echo "Production is not ready yet. Waiting 15 seconds..."
            sleep 15
          done

          echo "Production smoke test failed after waiting for Render."
          exit 1

  aws_oidc:
    name: ☁️ AWS OIDC · Backend Identity
    needs: terraform
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/1021805193-reto2' && vars.AWS_BACKEND_ROLE_ARN != '' }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure temporary AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: lisource-reto2-${{ github.run_id }}

      - name: Validate AWS federated identity
        run: aws sts get-caller-identity