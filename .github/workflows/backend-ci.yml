name: 1021805193 · Backend CI/CD

run-name: "${{ github.event.head_commit.message || github.event.pull_request.title }} · Reto 2 · 1021805193"

on:
  push:
    branches:
      - 1021805193-reto2
  pull_request:
    branches:
      - 1021805193-reto2

permissions:
  contents: read

jobs:
  quality:
    name: 🧪 Test & Verify Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lisource-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: lisource-backend/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests and verification
        run: ./mvnw -B clean verify

  docker:
    name: 🐳 Validate Docker Image
    needs: quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lisource-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t lisource-backend:ci .

  deploy:
    name: 🚀 Deploy to Render
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/1021805193-reto2'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"