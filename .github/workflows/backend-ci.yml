name: LISource · Reto 2 · Backend DevSecOps

run-name: "${{ github.event.head_commit.message || github.event.pull_request.title || 'Manual validation' }} · Backend · 1021805193"

on:
  push:
    branches:
      - 1021805193-reto2
    paths:
      - "lisource-backend/**"
      - "infra/aws-oidc/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - 1021805193-reto2
    paths:
      - "lisource-backend/**"
      - "infra/aws-oidc/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: 🧪 Quality Gate · Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lisource-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: lisource-backend/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests and verification
        run: ./mvnw -B clean verify

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lisource-backend-test-reports
          path: |
            lisource-backend/target/surefire-reports/**
            lisource-backend/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

  codeql:
    name: 🔐 CodeQL · Java
    needs: quality
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none

      - name: Analyze Java security
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"

  docker:
    name: 🐳 Container · Build & Validate
    needs: codeql
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lisource-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t lisource-backend:ci .

      - name: Export Docker image
        run: |
          docker save lisource-backend:ci \
            | gzip -1 \
            > "$RUNNER_TEMP/lisource-backend-ci.tar.gz"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: lisource-backend-image
          path: ${{ runner.temp }}/lisource-backend-ci.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  trivy:
    name: 🛡️ Trivy · Container Security
    needs: docker
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: lisource-backend-image
          path: ${{ runner.temp }}

      - name: Load Docker image
        run: |
          gzip -dc "$RUNNER_TEMP/lisource-backend-ci.tar.gz" \
            | docker load

      - name: Generate Trivy security report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lisource-backend:ci
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Enforce critical vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lisource-backend:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  terraform:
    name: 🏗️ Terraform · Validate
    needs: trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Terraform formatting
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/infra/aws-oidc:/workspace" \
            -w /workspace \
            hashicorp/terraform:1.15.8 \
            fmt -check -recursive

      - name: Initialize Terraform without backend
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/infra/aws-oidc:/workspace" \
            -w /workspace \
            hashicorp/terraform:1.15.8 \
            init -backend=false -input=false

      - name: Validate Terraform configuration
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/infra/aws-oidc:/workspace" \
            -w /workspace \
            hashicorp/terraform:1.15.8 \
            validate

  deploy:
    name: 🚀 Render · Deploy
    needs: terraform
    if: github.event_name == 'push' && github.ref == 'refs/heads/1021805193-reto2'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"

  smoke:
    name: 🌐 Production · Smoke Test
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/1021805193-reto2'
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Render and verify production
        run: |
          for attempt in $(seq 1 24); do
            echo "Production verification attempt ${attempt}/24"

            health="$(
              curl --silent --show-error \
                --max-time 30 \
                "https://technical-test-2026-2-v96h.onrender.com/actuator/health" \
                || true
            )"

            openapi="$(
              curl --silent --show-error \
                --max-time 30 \
                "https://technical-test-2026-2-v96h.onrender.com/v3/api-docs" \
                || true
            )"

            if echo "$health" | grep -q '"status":"UP"' \
              && echo "$openapi" | grep -q 'https://technical-test-2026-2-v96h.onrender.com' \
              && echo "$openapi" | grep -q '/api/v1/equipment'; then

              echo "LISource backend production is healthy."
              exit 0
            fi

            echo "Production is not ready yet. Waiting 15 seconds..."
            sleep 15
          done

          echo "Production smoke test failed after waiting for Render."
          exit 1

  aws-identity:
    name: ☁️ AWS · OIDC Identity
    needs: terraform
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/1021805193-reto2'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: lisource-reto2-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify AWS caller identity
        shell: bash
        run: |
          identity_arn="$(aws sts get-caller-identity --query Arn --output text)"

          echo "Temporary AWS identity acquired through GitHub OIDC."

          if [[ "${identity_arn}" != *"assumed-role/lisource-github-oidc-reto2/"* ]]; then
            echo "Unexpected AWS role."
            exit 1
          fi

          echo "LISource Backend successfully assumed the expected AWS IAM role."

