name: 1021805193 · Backend CI/CD

run-name: "${{ github.event.head_commit.message || github.event.pull_request.title }} · Reto 2 · 1021805193"

on:
  push:
    branches:
      - 1021805193-reto2
  pull_request:
    branches:
      - 1021805193-reto2

permissions:
  contents: read

jobs:
  quality:
    name: 🧪 Test & Verify Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lisource-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: lisource-backend/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests and verification
        run: ./mvnw -B clean verify

  codeql:
    name: 🔐 CodeQL · Java
    needs: quality
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none

      - name: Analyze Java security
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"

  docker:
    name: 🐳 Validate Docker Image
    needs: codeql
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lisource-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t lisource-backend:ci .

      - name: Export Docker image
        run: |
          docker save lisource-backend:ci \
            | gzip -1 \
            > "$RUNNER_TEMP/lisource-backend-ci.tar.gz"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: lisource-backend-image
          path: ${{ runner.temp }}/lisource-backend-ci.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  trivy:
    name: 🛡️ Trivy · Container Security
    needs: docker
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: lisource-backend-image
          path: ${{ runner.temp }}

      - name: Load Docker image
        run: |
          gzip -dc "$RUNNER_TEMP/lisource-backend-ci.tar.gz" \
            | docker load

      - name: Generate Trivy security report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lisource-backend:ci
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Enforce critical vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lisource-backend:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    name: 🚀 Deploy to Render
    needs: trivy
    if: github.event_name == 'push' && github.ref == 'refs/heads/1021805193-reto2'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"

  smoke:
    name: 🌐 Production Smoke Test
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/1021805193-reto2'
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Render and verify production
        run: |
          for attempt in $(seq 1 24); do
            echo "Production verification attempt ${attempt}/24"

            health="$(
              curl --silent --show-error \
                --max-time 30 \
                "https://technical-test-2026-2-v96h.onrender.com/actuator/health" \
                || true
            )"

            openapi="$(
              curl --silent --show-error \
                --max-time 30 \
                "https://technical-test-2026-2-v96h.onrender.com/v3/api-docs" \
                || true
            )"

            if echo "$health" | grep -q '"status":"UP"' \
              && echo "$openapi" | grep -q 'https://technical-test-2026-2-v96h.onrender.com' \
              && echo "$openapi" | grep -q '/api/v1/equipment'; then

              echo "LISource backend production is healthy."
              exit 0
            fi

            echo "Production is not ready yet. Waiting 15 seconds..."
            sleep 15
          done

          echo "Production smoke test failed after waiting for Render."
          exit 1